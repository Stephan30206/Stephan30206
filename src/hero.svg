<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#2a211c"/></pattern>
    <clipPath id="ph"><rect x="870" y="80" width="240" height="300"/></clipPath>
  </defs>
  <rect width="1200" height="660" fill="#14100e"/>
  <rect width="1200" height="660" fill="url(#dots)"/>

  <g stroke="#c4552d" stroke-width="4" fill="none">
    <path d="M24 70 V24 H70"/><path d="M1176 70 V24 H1130"/>
    <path d="M24 490 V536 H70"/><path d="M1176 490 V536 H1130"/>
  </g>

  <rect x="60" y="50" width="280" height="44" fill="none" stroke="#c4552d" stroke-width="2"/>
  <text x="80" y="79" font-family="monospace" font-size="18" fill="#c4552d" letter-spacing="3">■ OPEN TO WORK</text>

  <text x="60" y="235" font-family="monospace" font-size="150" font-weight="bold" fill="#f3ece4">STEPH<tspan fill="#c4552d">AN</tspan></text>
  <rect x="705" y="222" width="70" height="14" fill="#c4552d"><animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/></rect>

  <text x="60" y="305" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" fill="#f3ece4">Full-Stack &amp; AI developer building</text>
  <text x="60" y="348" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" fill="#f3ece4">useful systems, end to end.</text>

  <g font-family="monospace" font-size="16" fill="#c4552d" letter-spacing="2">
    <rect x="60" y="385" width="170" height="40" fill="none" stroke="#c4552d"/><text x="78" y="411">■ AI / ML</text>
    <rect x="245" y="385" width="120" height="40" fill="none" stroke="#c4552d"/><text x="263" y="411">■ WEB</text>
    <rect x="380" y="385" width="150" height="40" fill="none" stroke="#c4552d"/><text x="398" y="411">■ MOBILE</text>
  </g>

  <text x="60" y="500" font-family="monospace" font-size="28" fill="#f3ece4"><tspan fill="#c4552d">$</tspan> ./ship --production</text>
  <rect x="425" y="478" width="14" height="28" fill="#c4552d"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>

  <!-- photo -->
  <g stroke="#c4552d" stroke-width="4" fill="none">
    <path d="M850 110 V60 H900"/><path d="M1130 60 H1080 M1130 60 V110"/>
    <path d="M850 400 V450 H900"/><path d="M1130 400 V450 H1080"/>
  </g>
  <rect x="870" y="80" width="240" height="300" fill="#1e1612"/>
  <image href="data:image/jpeg;base64,PHOTO_BASE64" x="870" y="80" width="240" height="300" preserveAspectRatio="xMidYMid slice" clip-path="url(#ph)"/>
  <rect x="870" y="380" width="240" height="40" fill="#14100e" opacity="0.9"/>
  <text x="884" y="405" font-family="monospace" font-size="13" fill="#f3ece4" letter-spacing="1">STEPHAN // AI DEVELOPER</text>

  <g font-family="monospace" font-size="15" fill="#c4552d" letter-spacing="2">
    <rect x="1040" y="70" width="110" height="34" fill="#14100e" stroke="#c4552d" stroke-width="2"/><text x="1056" y="93">■ 200 OK</text>
    <rect x="770" y="190" width="120" height="36" fill="#14100e" stroke="#c4552d" stroke-width="2"/><text x="786" y="214">■ ONLINE</text>
    <rect x="760" y="360" width="120" height="36" fill="#14100e" stroke="#c4552d" stroke-width="2"/><text x="776" y="384">■ REMOTE</text>
    <rect x="1000" y="445" width="150" height="36" fill="#14100e" stroke="#c4552d" stroke-width="2"/><text x="1016" y="469">■ UTC+3 · MG</text>
  </g>

  <!-- strip -->
  <text x="60" y="600" font-family="monospace" font-size="13" fill="#8a7d74" letter-spacing="4">SYSTEM ONLINE</text>
  <text x="1140" y="600" font-family="monospace" font-size="13" fill="#f3ece4" letter-spacing="4" text-anchor="end">200 OK</text>
  <path pathLength="1000" d="M60 628 H430 L450 595 L470 655 L490 628 H700 L720 590 L745 660 L765 628 H1140" fill="none" stroke="#3a2a22" stroke-width="2"/>
  <path pathLength="1000" d="M60 628 H430 L450 595 L470 655 L490 628 H700 L720 590 L745 660 L765 628 H1140" fill="none" stroke="#c4552d" stroke-width="3" stroke-dasharray="120 880">
    <animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="3s" repeatCount="indefinite"/>
  </path>
</svg>
